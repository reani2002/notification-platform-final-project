<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540">
<rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:22px;font-weight:bold}.b{font-size:14px;font-weight:bold}.m{font-size:12px}.n{font-size:11px}</style>
<text class="t" x="30" y="38">C4 Context — Unified Notification Platform</text>
<rect x="40" y="100" width="180" height="75" rx="10" fill="#f7f7f7" stroke="#555"/>
<text class="b" x="130" y="125" text-anchor="middle">Corporate client</text><text class="n" x="130" y="143" text-anchor="middle">DBO user</text>
<rect x="270" y="100" width="190" height="75" rx="10" fill="#f7f7f7" stroke="#555"/>
<text class="b" x="365" y="125" text-anchor="middle">DBO Frontend</text><text class="n" x="365" y="143" text-anchor="middle">no own DB</text>
<rect x="520" y="80" width="230" height="110" rx="10" fill="#f7f7f7" stroke="#555"/>
<text class="b" x="635" y="105" text-anchor="middle">Notification Platform</text><text class="n" x="635" y="123" text-anchor="middle">digest / history</text><text class="n" x="635" y="138" text-anchor="middle">retry / quarantine</text><text class="n" x="635" y="153" text-anchor="middle">observability</text>
<rect x="830" y="55" width="220" height="75" rx="10" fill="#f7f7f7" stroke="#555"/>
<text class="b" x="940" y="80" text-anchor="middle">Product Services</text><text class="n" x="940" y="98" text-anchor="middle">reports + legacy</text>
<rect x="830" y="165" width="220" height="75" rx="10" fill="#f7f7f7" stroke="#555"/>
<text class="b" x="940" y="190" text-anchor="middle">Report Storage</text><text class="n" x="940" y="208" text-anchor="middle">PDF + protected links</text>
<rect x="830" y="275" width="220" height="75" rx="10" fill="#f7f7f7" stroke="#555"/>
<text class="b" x="940" y="300" text-anchor="middle">Event Broker</text><text class="n" x="940" y="318" text-anchor="middle">ReportReady</text><text class="n" x="940" y="333" text-anchor="middle">DigestPublished</text>
<rect x="520" y="300" width="230" height="75" rx="10" fill="#f7f7f7" stroke="#555"/>
<text class="b" x="635" y="325" text-anchor="middle">IAM / API Gateway</text><text class="n" x="635" y="343" text-anchor="middle">OAuth2 / mTLS</text>
<rect x="520" y="420" width="230" height="75" rx="10" fill="#f7f7f7" stroke="#555"/>
<text class="b" x="635" y="445" text-anchor="middle">SRE / SIEM</text><text class="n" x="635" y="463" text-anchor="middle">metrics / logs / traces</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="220" y1="138" x2="270" y2="138" stroke="#333" marker-end="url(#a)"/><text class="m" x="245" y="131" text-anchor="middle">UI</text>
<line x1="460" y1="138" x2="520" y2="138" stroke="#333" marker-end="url(#a)"/><text class="m" x="490" y="131" text-anchor="middle">HTTPS</text>
<line x1="830" y1="92" x2="750" y2="110" stroke="#333" marker-end="url(#a)"/><text class="m" x="790" y="94" text-anchor="middle">ReportReady</text>
<line x1="750" y1="170" x2="830" y2="200" stroke="#333" marker-end="url(#a)"/><text class="m" x="790" y="178" text-anchor="middle">protected URL</text>
<line x1="830" y1="312" x2="750" y2="180" stroke="#333" marker-end="url(#a)"/><text class="m" x="790" y="239" text-anchor="middle">events</text>
<line x1="635" y1="300" x2="635" y2="190" stroke="#333" marker-end="url(#a)"/><text class="m" x="635" y="238" text-anchor="middle">auth</text>
<line x1="635" y1="300" x2="635" y2="420" stroke="#333" marker-end="url(#a)"/><text class="m" x="635" y="353" text-anchor="middle">telemetry</text>
