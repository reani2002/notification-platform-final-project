<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.a{font-size:14px;font-weight:bold}.m{font-size:12px}.alt{font-size:12px;font-weight:bold}</style>
<rect x="40" y="28" width="140" height="38" rx="6" fill="#f2f2f2" stroke="#555"/><text class="a" x="110" y="52" text-anchor="middle">Product Service</text><line x1="110" y1="66" x2="110" y2="720" stroke="#999" stroke-dasharray="5,5"/>
<rect x="230" y="28" width="140" height="38" rx="6" fill="#f2f2f2" stroke="#555"/><text class="a" x="300" y="52" text-anchor="middle">Broker</text><line x1="300" y1="66" x2="300" y2="720" stroke="#999" stroke-dasharray="5,5"/>
<rect x="420" y="28" width="140" height="38" rx="6" fill="#f2f2f2" stroke="#555"/><text class="a" x="490" y="52" text-anchor="middle">Ingestor</text><line x1="490" y1="66" x2="490" y2="720" stroke="#999" stroke-dasharray="5,5"/>
<rect x="620" y="28" width="140" height="38" rx="6" fill="#f2f2f2" stroke="#555"/><text class="a" x="690" y="52" text-anchor="middle">Notification DB</text><line x1="690" y1="66" x2="690" y2="720" stroke="#999" stroke-dasharray="5,5"/>
<rect x="820" y="28" width="140" height="38" rx="6" fill="#f2f2f2" stroke="#555"/><text class="a" x="890" y="52" text-anchor="middle">Digest Service</text><line x1="890" y1="66" x2="890" y2="720" stroke="#999" stroke-dasharray="5,5"/>
<rect x="1010" y="28" width="140" height="38" rx="6" fill="#f2f2f2" stroke="#555"/><text class="a" x="1080" y="52" text-anchor="middle">DBO API</text><line x1="1080" y1="66" x2="1080" y2="720" stroke="#999" stroke-dasharray="5,5"/>
<line x1="110" y1="105" x2="300" y2="105" stroke="#222"/><path d="M300 105 l-10 -5 l0 10 z" fill="#222"/><text class="m" x="205" y="98" text-anchor="middle">1. ReportReady(eventId, report key)</text>
<line x1="300" y1="150" x2="490" y2="150" stroke="#222"/><path d="M490 150 l-10 -5 l0 10 z" fill="#222"/><text class="m" x="395" y="143" text-anchor="middle">2. deliver (at-least-once)</text>
<line x1="490" y1="195" x2="690" y2="195" stroke="#222"/><path d="M690 195 l-10 -5 l0 10 z" fill="#222"/><text class="m" x="590" y="188" text-anchor="middle">3. validate + dedup + commit</text>
<line x1="690" y1="235" x2="490" y2="235" stroke="#222" stroke-dasharray="6,4"/><path d="M490 235 l10 -5 l0 10 z" fill="#222"/><text class="m" x="590" y="228" text-anchor="middle">4. committed</text>
<line x1="490" y1="275" x2="300" y2="275" stroke="#222" stroke-dasharray="6,4"/><path d="M300 275 l10 -5 l0 10 z" fill="#222"/><text class="m" x="395" y="268" text-anchor="middle">5. ACK after commit</text>
<line x1="490" y1="315" x2="890" y2="315" stroke="#222"/><path d="M890 315 l-10 -5 l0 10 z" fill="#222"/><text class="m" x="690" y="308" text-anchor="middle">6. readiness available</text>
<line x1="890" y1="355" x2="690" y2="355" stroke="#222"/><path d="M690 355 l10 -5 l0 10 z" fill="#222"/><text class="m" x="790" y="348" text-anchor="middle">7. build/update digest</text>
<line x1="890" y1="395" x2="1080" y2="395" stroke="#222"/><path d="M1080 395 l-10 -5 l0 10 z" fill="#222"/><text class="m" x="985" y="388" text-anchor="middle">8. DigestPublished / read state</text>
<rect x="45" y="440" width="1110" height="82" fill="#fafafa" stroke="#777"/><text class="alt" x="60" y="462">ALT A — duplicate ReportReady</text><text class="m" x="60" y="492">duplicate → idempotent no-op; no second business effect; ACK after existing state is confirmed.</text>
<rect x="45" y="535" width="1110" height="82" fill="#fafafa" stroke="#777"/><text class="alt" x="60" y="557">ALT B — DB outage</text><text class="m" x="60" y="587">commit fails → no ACK → retry 5s/30s/120s → quarantine/DLQ → operator reprocess.</text>
<rect x="45" y="630" width="1110" height="82" fill="#fafafa" stroke="#777"/><text class="alt" x="60" y="652">ALT C — late report</text><text class="m" x="60" y="682">ReportReady after cutoff → update same digestId; digestVersion++; do not create a second logical digest.</text>
</svg>