<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370">
<rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:22px;font-weight:bold}.b{font-size:14px;font-weight:bold}.m{font-size:12px}.n{font-size:11px}</style>
<text class="t" x="30" y="38">Data &amp; Event Flow</text>
<rect x="35" y="90" width="180" height="80" rx="10" fill="#f7f7f7" stroke="#555"/><text class="b" x="125" y="115" text-anchor="middle">Product Service</text><text class="n" x="125" y="133" text-anchor="middle">owns PDF/report metadata</text>
<rect x="260" y="90" width="185" height="80" rx="10" fill="#f7f7f7" stroke="#555"/><text class="b" x="352.5" y="115" text-anchor="middle">ReportReady v1</text><text class="n" x="352.5" y="133" text-anchor="middle">eventId + report key</text>
<rect x="490" y="75" width="210" height="110" rx="10" fill="#f7f7f7" stroke="#555"/><text class="b" x="595" y="100" text-anchor="middle">Ingest / State</text><text class="n" x="595" y="118" text-anchor="middle">validate → dedup</text><text class="n" x="595" y="133" text-anchor="middle">commit → ACK</text>
<rect x="755" y="75" width="210" height="110" rx="10" fill="#f7f7f7" stroke="#555"/><text class="b" x="860" y="100" text-anchor="middle">Digest</text><text class="n" x="860" y="118" text-anchor="middle">digestId + version</text><text class="n" x="860" y="133" text-anchor="middle">PUBLISHED / UPDATED</text>
<rect x="755" y="245" width="210" height="80" rx="10" fill="#f7f7f7" stroke="#555"/><text class="b" x="860" y="270" text-anchor="middle">DBO Client</text><text class="n" x="860" y="288" text-anchor="middle">GET /me/digests</text>
<rect x="490" y="245" width="210" height="80" rx="10" fill="#f7f7f7" stroke="#555"/><text class="b" x="595" y="270" text-anchor="middle">Quarantine</text><text class="n" x="595" y="288" text-anchor="middle">retry → reprocess</text>
<rect x="260" y="245" width="185" height="80" rx="10" fill="#f7f7f7" stroke="#555"/><text class="b" x="352.5" y="270" text-anchor="middle">Reconciliation</text><text class="n" x="352.5" y="288" text-anchor="middle">find gaps / mismatch</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="215" y1="130" x2="260" y2="130" stroke="#333" marker-end="url(#a)"/><line x1="445" y1="130" x2="490" y2="130" stroke="#333" marker-end="url(#a)"/><line x1="700" y1="130" x2="755" y2="130" stroke="#333" marker-end="url(#a)"/><line x1="860" y1="185" x2="860" y2="245" stroke="#333" marker-end="url(#a)"/><line x1="595" y1="185" x2="595" y2="245" stroke="#333" marker-end="url(#a)"/><text class="m" x="595" y="208" text-anchor="middle">error</text><line x1="490" y1="285" x2="445" y2="285" stroke="#333" marker-end="url(#a)"/><text class="m" x="467.5" y="278" text-anchor="middle">compare</text>
</svg>